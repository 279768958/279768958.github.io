    function pick(tag) {
      const value = (tag || '').toLowerCase();
      // 繁体要先认，否则 zh-Hant / zh-TW / zh-HK 都会掉进简体
      if (value.startsWith('zh-hant') || value.startsWith('zh-tw') || value.startsWith('zh-hk') || value.startsWith('zh-mo')) {
        return 'hant';
      }
      if (value.startsWith('zh')) return 'zh';
      if (value.startsWith('ja')) return 'ja';
      if (value.startsWith('fr')) return 'fr';
      if (value.startsWith('pt')) return 'pt';
      if (value.startsWith('ru')) return 'ru';
      if (value.startsWith('en')) return 'en';
      return 'zh';
    }

    function appendTextWithContact(parent, text) {
      const parts = text.split(CONTACT);
      parts.forEach((part, index) => {
        if (index > 0) {
          const link = document.createElement('a');
          link.href = 'mailto:' + CONTACT;
          link.textContent = CONTACT;
          parent.appendChild(link);
        }
        if (part) parent.appendChild(document.createTextNode(part));
      });
    }

    function render(id) {
      const copy = COPY[id];
      document.documentElement.lang = copy.html;
      document.title = copy.title;
      document.getElementById('title').textContent = copy.title;
      document.getElementById('meta').textContent = copy.meta;
      document.getElementById('policy').textContent = copy.policy;
      const body = document.getElementById('body');
      body.replaceChildren();
      copy.sections.forEach(([heading, text]) => {
        const h2 = document.createElement('h2');
        h2.textContent = heading;
        const p = document.createElement('p');
        appendTextWithContact(p, text);
        body.append(h2, p);
      });
      document.querySelectorAll('#langs button').forEach((button) => {
        button.setAttribute('aria-pressed', button.dataset.id === id ? 'true' : 'false');
      });
    }

    const nav = document.getElementById('langs');
    Object.entries(COPY).forEach(([id, copy]) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.dataset.id = id;
      button.textContent = copy.name;
      button.addEventListener('click', () => render(id));
      nav.appendChild(button);
    });

    const query = new URLSearchParams(location.search).get('lang');
    render(pick(query || navigator.language));
  </script>
</body>
</html>
